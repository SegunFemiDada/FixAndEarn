name: FixAndEarn API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  api-ci:
    name: API Build, Test and Lint
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fixandearn_ci?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixandearn_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fixandearn_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @fixandearn/api prisma:generate

      - name: Validate Prisma schema
        run: pnpm --filter @fixandearn/api exec prisma validate

      - name: Apply Prisma migrations
        run: pnpm --filter @fixandearn/api prisma:migrate:deploy

      - name: Lint API
        run: pnpm --filter @fixandearn/api lint

      - name: Run API tests
        run: pnpm --filter @fixandearn/api test

      - name: Build API
        run: pnpm --filter @fixandearn/api build